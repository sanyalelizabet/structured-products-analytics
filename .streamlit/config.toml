# =========================================================================
# Streamlit theme — Structured Products Analytics
# =========================================================================
# The default Streamlit primary colour is red (#FF4B4B), which reads as
# "error" in a financial dashboard.  We override to a calm corporate
# blue so:
#
#   * primary buttons look like call-to-action, not warnings;
#   * selected dataframe rows / radio items / focused inputs all use
#     a neutral accent that pairs with the dark Plotly charts;
#   * the semantic colours (error red, warning amber, success green)
#     stay reserved for their actual meanings.

[theme]
base            = "dark"
primaryColor    = "#3B82F6"     # corporate blue (Tailwind blue-500)
backgroundColor = "#0E1117"     # Streamlit dark default
secondaryBackgroundColor = "#1E2230"
textColor       = "#FAFAFA"
font            = "sans serif"

# =========================================================================
# Server — production deployment posture
# =========================================================================
# Disable Streamlit's file-change auto-reload subsystem on production
# deployments. The watcher uses inotify under the hood; on shared
# environments such as Streamlit Cloud the inotify watch budget is
# routinely exhausted and the watcher threads die with ENOSPC, flooding
# the logs and masking real application errors. Auto-reload is a
# developer-loop convenience and is not needed in production: a git
# push triggers a clean redeploy regardless.

[server]
fileWatcherType = "none"

# Surface application errors in the browser so production diagnostics
# are not gated on log-tab access.

[client]
showErrorDetails = true
